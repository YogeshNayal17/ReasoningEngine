name: reason_ai
description: "Reason AI - helps users think critically about the information they consume."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management + DI. Providers double as our dependency injection
  # mechanism (see README.md "Dependency injection" section) — no separate
  # service locator (get_it/injectable) is used, to avoid running two
  # competing DI systems side by side.
  flutter_riverpod: ^3.3.2

  # Declarative routing with deep-link support, needed once the overlay
  # feature (Milestone 2) needs to launch into the app from outside its
  # normal lifecycle.
  go_router: ^17.3.0

  # Logging backend behind the AppLogger interface (lib/core/logging).
  logger: ^2.7.0

  # On-device OCR (Milestone 5) — wraps Google ML Kit's text recognizer.
  # Fully offline, free, no API key/Firebase project required.
  google_mlkit_text_recognition: ^0.16.0

  # Needed to write a cropped screenshot to a temp file: ML Kit's
  # file-based InputImage API is the reliable way to feed it an
  # already-decoded (non-raw-pixel) image.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
